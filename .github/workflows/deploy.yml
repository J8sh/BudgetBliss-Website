name: Deploy to Production

on:
  push:
    branches: [main]
                                                                                            
jobs:
  deploy:                                                                                   
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:                                                                               
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}  # the restricted deploy user
          key: ${{ secrets.SERVER_SSH_KEY }}                                                
          port: ${{ secrets.SERVER_PORT }}
          # server01 forces this key to run `deploy-app budgetbliss` (git pull --ff-only, docker
          # compose up --build -d, image prune) as a restricted 'deploy' user, so the command
          # sent here is ignored. See /usr/local/bin/deploy-app on the server.
          script: deploy
